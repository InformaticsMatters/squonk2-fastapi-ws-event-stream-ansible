---

- name: Assert key variables
  ansible.builtin.assert:
    that:
    - ess_namespace | length > 0
    - ess_namespace != 'SetMe'
    - ess_image_tag | length > 0
    - ess_image_tag != 'SetMe'
    - ess_service_account | length > 0
    - ess_service_account != 'SetMe'
    - ess_ws_hostname | length > 0
    - ess_ws_hostname != 'SetMe'

# Check the namespace and other basic materials

- name: Get Namespace ({{ ess_namespace }})
  kubernetes.core.k8s_info:
    kind: Namespace
    name: "{{ ess_namespace }}"
  register: ns_result

- name: Assert Namespace ({{ ess_namespace }})
  ansible.builtin.assert:
    that:
    - ns_result.resources | length == 1

- name: Get ServiceAccount
  kubernetes.core.k8s_info:
    kind: ServiceAccount
    name: "{{ ess_service_account }}"
    namespace: "{{ ess_namespace }}"
  register: sa_result

- name: Assert ServiceAccount
  ansible.builtin.assert:
    that:
    - sa_result.resources | length == 1

- name: Get RabbitMQ Secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: rabbitmq
    namespace: "{{ ess_namespace }}"
  register: s_result

- name: Insist that we have secrets
  ansible.builtin.assert:
    that:
    - s_result.resources | length == 1

- name: Set ESS RabbitMQ credentials
  ansible.builtin.set_fact:
    rmq_user: "{{ s_result.resources[0].data.vhost_es_user | b64decode }}"
    rmq_password: "{{ s_result.resources[0].data.vhost_es_user_password | b64decode }}"

- name: Set ESS RabbitMQ url
  ansible.builtin.set_fact:
    ampq_url: amqp://{{ rmq_user }}:{{ rmq_password }}@rabbit.{{ ess_namespace }}.svc.cluster.local:{{ ess_rmq_port }}/as?heartbeat=90

# Ok - looks like everything's set up. Let's deploy the ESS

- name: Deploy PVCs ({{ ess_namespace }})
  kubernetes.core.k8s:
    definition: "{{ lookup('template', item) }}"
  loop:
  - pvc-database.yaml.j2
  - pvc-log.yaml.j2

- name: Deploy objects ({{ ess_namespace }})
  kubernetes.core.k8s:
    definition: "{{ lookup('template', item) }}"
    wait: yes
  loop:
  - deployment.yaml.j2
  - service-api.yaml.j2
  - service-ws.yaml.j2

- name: Deploy ingress ({{ ess_namespace }})
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'ingress.yaml.j2') }}"
    wait: yes
  when: ess_ingress_state == 'present'
